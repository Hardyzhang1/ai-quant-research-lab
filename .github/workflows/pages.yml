name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: "."

      - name: Deploy
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5.0.1

      # An uploaded artifact can briefly be absent from the artifact service's list.
      - name: Wait before retrying deployment
        if: ${{ !cancelled() && steps.deployment.outcome == 'failure' }}
        run: sleep 15

      - name: Retry deployment
        id: deployment_retry
        if: ${{ !cancelled() && steps.deployment.outcome == 'failure' }}
        uses: actions/deploy-pages@v5.0.1
